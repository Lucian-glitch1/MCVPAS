name: MCVPAS Final Defense APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/mcvpas
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MCVPAS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mcvpas'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mcvpas'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '3.0'
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="navy">#182A5A</color>
              <color name="blue">#2F5BEA</color>
              <color name="background">#F5F7FB</color>
              <color name="white">#FFFFFF</color>
              <color name="text">#172033</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">@color/navy</item>
                  <item name="android:navigationBarColor">@color/navy</item>
                  <item name="android:colorAccent">@color/blue</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#2F5BEA"
                  android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,18L60,39L82,39L64,52L71,75L54,62L37,75L44,52L26,39L48,39Z"/>
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION"/>

              <uses-permission
                  android:name="android.permission.ACCESS_COARSE_LOCATION"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="MCVPAS"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/mcvpas/MainActivity.java <<'EOF'
          package com.mcvpas;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.location.Location;
          import android.location.LocationManager;
          import android.view.Gravity;
          import android.widget.*;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {

              LinearLayout content;
              SharedPreferences db;
              LocationManager locationManager;
              EditText locationField;

              int NAVY = Color.rgb(24,42,90);
              int BLUE = Color.rgb(47,91,234);
              int BG = Color.rgb(245,247,251);
              int TEXT = Color.rgb(23,32,51);
              int MUTED = Color.rgb(100,110,130);

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  db = getSharedPreferences("mcvpas", MODE_PRIVATE);
                  locationManager =
                      (LocationManager)getSystemService(LOCATION_SERVICE);

                  cover();
              }

              TextView txt(String s,float size,int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setPadding(0,8,0,8);
                  return t;
              }

              TextView title(String s) {
                  TextView t = txt(s,25,TEXT);
                  t.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                  return t;
              }

              Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  b.setTextSize(16);
                  b.setTextColor(TEXT);
                  b.setMinHeight(58);

                  GradientDrawable g = new GradientDrawable();
                  g.setColor(Color.WHITE);
                  g.setCornerRadius(18);
                  b.setBackground(g);

                  return b;
              }

              EditText field(String hint) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setTextSize(16);
                  e.setPadding(18,5,18,5);

                  GradientDrawable g = new GradientDrawable();
                  g.setColor(Color.WHITE);
                  g.setCornerRadius(15);
                  g.setStroke(1,Color.rgb(220,225,235));
                  e.setBackground(g);

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(-1,58);

                  p.setMargins(0,6,0,8);
                  e.setLayoutParams(p);

                  return e;
              }

              void cover() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setGravity(Gravity.CENTER);
                  l.setPadding(30,30,30,30);
                  l.setBackgroundColor(NAVY);

                  TextView a = txt("MCVPAS",45,Color.WHITE);
                  a.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                  a.setGravity(Gravity.CENTER);

                  TextView b = txt(
                      "Smart Missing Child and Vulnerable Person Alert System",
                      17,Color.rgb(225,232,255));

                  b.setGravity(Gravity.CENTER);

                  TextView c = txt(
                      "REPORT • ALERT • SIGHT • RESPOND",
                      13,Color.rgb(190,205,245));

                  c.setGravity(Gravity.CENTER);

                  l.addView(a);
                  l.addView(b);
                  l.addView(c);

                  setContentView(l);

                  new Handler().postDelayed(
                      () -> home(),1600);
              }

              void base(String name) {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);

                  LinearLayout bar = new LinearLayout(this);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setPadding(18,0,18,0);
                  bar.setBackgroundColor(NAVY);

                  TextView brand = txt("MCVPAS",20,Color.WHITE);
                  brand.setTypeface(Typeface.DEFAULT,Typeface.BOLD);

                  bar.addView(brand,
                      new LinearLayout.LayoutParams(0,62,1));

                  bar.addView(txt(name,14,Color.WHITE));

                  root.addView(bar,
                      new LinearLayout.LayoutParams(-1,62));

                  ScrollView scroll = new ScrollView(this);

                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(20,20,20,30);

                  scroll.addView(content);

                  root.addView(scroll,
                      new LinearLayout.LayoutParams(-1,0,1));

                  setContentView(root);
              }

              void home() {
                  base("Home");

                  content.addView(title("Community Safety Dashboard"));

                  content.addView(txt(
                      "Functional research prototype for reporting, " +
                      "monitoring and responding to missing-person cases.",
                      15,MUTED));

                  Button report =
                      button("🚨  Report Missing Person");

                  report.setOnClickListener(v -> report());

                  content.addView(report);

                  Button cases =
                      button("📋  View Active Cases");

                  cases.setOnClickListener(v -> cases());

                  content.addView(cases);

                  Button sight =
                      button("📍  Submit a Sighting");

                  sight.setOnClickListener(v -> sighting());

                  content.addView(sight);

                  Button alerts =
                      button("🔔  Alerts");

                  alerts.setOnClickListener(v -> alerts());

                  content.addView(alerts);

                  Button photo =
                      button("🖼️  Photo Matching Demonstration");

                  photo.setOnClickListener(v -> photo());

                  content.addView(photo);

                  Button admin =
                      button("🔐  Admin Dashboard");

                  admin.setOnClickListener(v -> admin());

                  content.addView(admin);

                  Button demo =
                      button("🎬  Load Defense Sample Data");

                  demo.setOnClickListener(v -> demo());

                  content.addView(demo);

                  Button about =
                      button("ℹ️  About System");

                  about.setOnClickListener(v -> about());

                  content.addView(about);
              }

              void report() {
                  base("Report Missing Person");

                  content.addView(title("New Missing-Person Report"));

                  content.addView(txt(
                      "Use fictional information for classroom demonstration.",
                      13,MUTED));

                  EditText name = field("Full Name");
                  EditText age = field("Age");

                  locationField =
                      field("Last Known Location");

                  EditText details =
                      field("Description");

                  Button gps =
                      button("📍  Use Current Location");

                  gps.setOnClickListener(v -> location());

                  Button save =
                      button("🚨  Submit Report");

                  save.setOnClickListener(v -> {

                      String n =
                          name.getText().toString().trim();

                      String loc =
                          locationField.getText().toString().trim();

                      if(n.isEmpty() || loc.isEmpty()) {
                          Toast.makeText(
                              this,
                              "Name and location are required.",
                              Toast.LENGTH_LONG).show();
                          return;
                      }

                      int count =
                          db.getInt("cases",0)+1;

                      String id =
                          String.format(
                              Locale.US,
                              "CASE-%03d",
                              count);

                      String record =
                          id+"|"+
                          n+"|"+
                          age.getText().toString()+"|"+
                          loc+"|"+
                          details.getText().toString()+"|"+
                          new SimpleDateFormat(
                              "yyyy-MM-dd HH:mm",
                              Locale.US).format(new Date());

                      db.edit()
                          .putInt("cases",count)
                          .putString(
                              "case_"+count,
                              record)
                          .apply();

                      Toast.makeText(
                          this,
                          id+" saved successfully!",
                          Toast.LENGTH_LONG).show();

                      cases();
                  });

                  content.addView(name);
                  content.addView(age);
                  content.addView(locationField);
                  content.addView(details);
                  content.addView(gps);
                  content.addView(save);

                  Button back =
                      button("← Back to Home");

                  back.setOnClickListener(v -> home());

                  content.addView(back);
              }

              void cases() {
                  base("Active Cases");

                  content.addView(title("Active Cases"));

                  int n =
                      db.getInt("cases",0);

                  if(n==0) {
                      content.addView(txt(
                          "No active cases. " +
                          "Use Load Defense Sample Data.",
                          16,MUTED));
                  }

                  for(int i=n;i>=1;i--) {

                      String r =
                          db.getString(
                              "case_"+i,"");

                      String[] p =
                          r.split("\\|",-1);

                      if(p.length>=6) {

                          TextView card =
                              txt(
                                  p[0]+"\n"+
                                  p[1]+" • Age: "+p[2]+"\n"+
                                  "📍 "+p[3]+"\n"+
                                  "STATUS: ACTIVE",
                                  17,TEXT);

                          content.addView(card);

                          Button view =
                              button(
                                  "View "+p[0]);

                          view.setOnClickListener(
                              v -> detail(r));

                          content.addView(view);
                      }
                  }

                  Button back =
                      button("← Back to Home");

                  back.setOnClickListener(
                      v -> home());

                  content.addView(back);
              }

              void detail(String r) {
                  base("Case Details");

                  String[] p =
                      r.split("\\|",-1);

                  content.addView(
                      title(p[0]));

                  content.addView(
                      txt(
                          "PERSON: "+p[1]+"\n\n"+
                          "AGE: "+p[2]+"\n\n"+
                          "LAST KNOWN LOCATION: "+p[3]+
                          "\n\nDESCRIPTION: "+p[4]+
                          "\n\nREPORTED: "+p[5]+
                          "\n\nSTATUS: ACTIVE",
                          17,TEXT));

                  Button s =
                      button(
                          "📍 Submit Sighting");

                  s.setOnClickListener(
                      v -> sighting());

                  content.addView(s);

                  Button back =
                      button("← Back");

                  back.setOnClickListener(
                      v -> cases());

                  content.addView(back);
              }

              void sighting() {
                  base("Submit Sighting");

                  content.addView(
                      title("Community Sighting"));

                  EditText id =
                      field("Case Number");

                  EditText loc =
                      field("Sighting Location");

                  EditText details =
                      field("What did you observe?");

                  Button save =
                      button("📤  Submit Sighting");

                  save.setOnClickListener(v -> {

                      if(id.getText().toString()
                          .trim().isEmpty() ||
                         loc.getText().toString()
                          .trim().isEmpty()) {

                          Toast.makeText(
                              this,
                              "Case number and location required.",
                              Toast.LENGTH_LONG).show();

                          return;
                      }

                      int count =
                          db.getInt("sightings",0)+1;

                      db.edit()
                          .putInt("sightings",count)
                          .putString(
                              "sighting_"+count,
                              id.getText().toString()+
                              "|"+
                              loc.getText().toString()+
                              "|"+
                              details.getText().toString())
                          .apply();

                      Toast.makeText(
                          this,
                          "Sighting submitted!",
                          Toast.LENGTH_LONG).show();

                      home();
                  });

                  content.addView(id);
                  content.addView(loc);
                  content.addView(details);
                  content.addView(save);

                  Button back =
                      button("← Back");

                  back.setOnClickListener(
                      v -> home());

                  content.addView(back);
              }

              void alerts() {
                  base("Alerts");

                  content.addView(
                      title("Community Alerts"));

                  int n =
                      db.getInt("cases",0);

                  if(n==0) {
                      content.addView(
                          txt(
                              "No active alerts.",
                              16,MUTED));
                  }

                  for(int i=n;i>=1;i--) {

                      String r =
                          db.getString(
                              "case_"+i,"");

                      String[] p =
                          r.split("\\|",-1);

                      if(p.length>=4) {
                          content.addView(
                              txt(
                                  "🚨 "+p[0]+"\n"+
                                  p[1]+"\n"+
                                  "📍 "+p[3]+"\n"+
                                  "STATUS: ACTIVE",
                                  17,TEXT));
                      }
                  }

                  Button back =
                      button("← Back to Home");

                  back.setOnClickListener(
                      v -> home());

                  content.addView(back);
              }

              void photo() {
                  base("Photo Matching");

                  content.addView(
                      title("Photo Matching Demonstration"));

                  content.addView(
                      txt(
                          "This prototype demonstrates photo selection. " +
                          "It does not claim validated facial-recognition accuracy.",
                          15,MUTED));

                  Button select =
                      button("🖼️  Select Reference Photo");

                  select.setOnClickListener(v -> {

                      Intent i =
                          new Intent(
                              Intent.ACTION_OPEN_DOCUMENT);

                      i.setType("image/*");

                      i.addCategory(
                          Intent.CATEGORY_OPENABLE);

                      startActivityForResult(i,100);
                  });

                  content.addView(select);

                  Button back =
                      button("← Back to Home");

                  back.setOnClickListener(
                      v -> home());

                  content.addView(back);
              }

              void admin() {
                  base("Admin Login");

                  content.addView(
                      title("Admin Login"));

                  EditText user =
                      field("Username");

                  EditText pass =
                      field("Password");

                  pass.setInputType(129);

                  Button login =
                      button("🔐  Login");

                  login.setOnClickListener(v -> {

                      if(user.getText().toString()
                          .equals("admin") &&
                         pass.getText().toString()
                          .equals("mcvpas123")) {

                          dashboard();

                      } else {

                          Toast.makeText(
                              this,
                              "Invalid login.",
                              Toast.LENGTH_LONG).show();
                      }
                  });

                  content.addView(user);
                  content.addView(pass);
                  content.addView(login);

                  content.addView(
                      txt(
                          "Demo account: admin / mcvpas123",
                          13,MUTED));
              }

              void dashboard() {
                  base("Admin Dashboard");

                  content.addView(
                      title("Admin Dashboard"));

                  int cases =
                      db.getInt("cases",0);

                  int sightings =
                      db.getInt("sightings",0);

                  content.addView(
                      txt(
                          "● SYSTEM STATUS: ONLINE\n\n"+
                          "Active Cases: "+cases+"\n"+
                          "Sightings: "+sightings+
                          "\n\nLocal Research Demo Storage",
                          17,TEXT));

                  Button clear =
                      button("⚠️  Clear Demo Data");

                  clear.setOnClickListener(v -> {

                      db.edit().clear().apply();

                      Toast.makeText(
                          this,
                          "Demo data cleared.",
                          Toast.LENGTH_LONG).show();

                      dashboard();
                  });

                  content.addView(clear);

                  Button logout =
                      button("Logout");

                  logout.setOnClickListener(
                      v -> home());

                  content.addView(logout);
              }

              void demo() {

                  db.edit()
                      .putInt("cases",2)
                      .putString(
                          "case_1",
                          "CASE-001|Alex Rivera|12|"+
                          "Angeles City Public Market|"+
                          "Fictional defense record.|"+
                          "2026-08-16 09:00")
                      .putString(
                          "case_2",
                          "CASE-002|Jamie Santos|67|"+
                          "Balibago, Angeles City|"+
                          "Fictional defense record.|"+
                          "2026-08-16 09:15")
                      .putInt("sightings",1)
                      .apply();

                  Toast.makeText(
                      this,
                      "Defense sample data loaded!",
                      Toast.LENGTH_LONG).show();

                  home();
              }

              void about() {
                  base("About");

                  content.addView(
                      title("MCVPAS"));

                  content.addView(
                      txt(
                          "Smart Missing Child and Vulnerable Person Alert System\n\n"+
                          "Functional research prototype demonstrating:\n\n"+
                          "• Missing-person reporting\n"+
                          "• Case management\n"+
                          "• Community sightings\n"+
                          "• Alerts\n"+
                          "• Photo selection\n"+
                          "• Admin monitoring\n"+
                          "• Defense sample data",
                          16,TEXT));

                  Button back =
                      button("← Back to Home");

                  back.setOnClickListener(
                      v -> home());

                  content.addView(back);
              }

              void location() {

                  if(checkSelfPermission(
                      Manifest.permission.ACCESS_FINE_LOCATION)
                      != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                          new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                          },200);

                      Toast.makeText(
                          this,
                          "Allow location permission, then try again.",
                          Toast.LENGTH_LONG).show();

                      return;
                  }

                  try {

                      Location l =
                          locationManager.getLastKnownLocation(
                              LocationManager.GPS_PROVIDER);

                      if(l == null) {
                          l =
                              locationManager.getLastKnownLocation(
                                  LocationManager.NETWORK_PROVIDER);
                      }

                      if(l != null && locationField != null) {

                          locationField.setText(
                              String.format(
                                  Locale.US,
                                  "%.6f, %.6f",
                                  l.getLatitude(),
                                  l.getLongitude()));

                      } else {

                          Toast.makeText(
                              this,
                              "No recent location found.",
                              Toast.LENGTH_LONG).show();
                      }

                  } catch(Exception e) {

                      Toast.makeText(
                          this,
                          "Location unavailable.",
                          Toast.LENGTH_LONG).show();
                  }
              }
          }
          EOF

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          arguments: clean assembleDebug

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MCVPAS-Final-Defense-APK
          path: app/build/outputs/apk/debug/app-debug.apk
  