name: Build MCVPAS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/mcvpas
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MCVPAS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mcvpas'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mcvpas'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      debuggable true
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#3949AB</item>
                  <item name="android:statusBarColor">#1A237E</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="MCVPAS"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/mcvpas/MainActivity.java <<'EOF'
          package com.mcvpas;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private LinearLayout layout;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showDashboard();
              }

              private TextView title(String text) {
                  TextView view = new TextView(this);
                  view.setText(text);
                  view.setTextSize(28);
                  view.setTextColor(Color.rgb(26, 35, 126));
                  view.setGravity(Gravity.CENTER);
                  view.setPadding(10, 20, 10, 20);
                  return view;
              }

              private Button button(String text) {
                  Button button = new Button(this);
                  button.setText(text);
                  button.setAllCaps(false);
                  return button;
              }

              private void showDashboard() {

                  ScrollView scroll = new ScrollView(this);

                  layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(25, 20, 25, 20);

                  scroll.addView(layout);
                  setContentView(scroll);

                  layout.addView(title("MCVPAS"));

                  TextView description = new TextView(this);
                  description.setText(
                      "Smart Missing Child and Vulnerable Person Alert System"
                  );
                  description.setTextSize(16);
                  description.setGravity(Gravity.CENTER);
                  layout.addView(description);

                  layout.addView(button("Report Missing Person"));
                  layout.addView(button("View Active Cases"));
                  layout.addView(button("Submit a Sighting"));
                  layout.addView(button("Alerts"));
                  layout.addView(button("AI-Assisted Photo Matching"));

                  Button report = (Button) layout.getChildAt(2);
                  report.setOnClickListener(v ->
                      Toast.makeText(
                          this,
                          "Report Missing Person selected",
                          Toast.LENGTH_SHORT
                      ).show()
                  );

                  Button cases = (Button) layout.getChildAt(3);
                  cases.setOnClickListener(v ->
                      Toast.makeText(
                          this,
                          "Active Cases selected",
                          Toast.LENGTH_SHORT
                      ).show()
                  );

                  Button sighting = (Button) layout.getChildAt(4);
                  sighting.setOnClickListener(v ->
                      Toast.makeText(
                          this,
                          "Submit a Sighting selected",
                          Toast.LENGTH_SHORT
                      ).show()
                  );

                  Button alerts = (Button) layout.getChildAt(5);
                  alerts.setOnClickListener(v ->
                      Toast.makeText(
                          this,
                          "Alerts selected",
                          Toast.LENGTH_SHORT
                      ).show()
                  );

                  Button ai = (Button) layout.getChildAt(6);
                  ai.setOnClickListener(v ->
                      Toast.makeText(
                          this,
                          "AI Photo Matching prototype",
                          Toast.LENGTH_SHORT
                      ).show()
                  );
              }
          }
          EOF

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Check APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MCVPAS-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error