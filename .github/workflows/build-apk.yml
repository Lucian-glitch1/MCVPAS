name: MCVPAS Final Defense APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/mcvpas
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MCVPAS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mcvpas'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mcvpas'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="primary">#263A91</color>
              <color name="primary_dark">#17235D</color>
              <color name="accent">#D32F2F</color>
              <color name="background">#F5F7FB</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">@color/primary</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:statusBarColor">@color/primary_dark</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#263A91"
                  android:pathData="M0,0 L108,0 L108,108 L0,108 Z"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,20 A34,34 0,1 0,54 88 A34,34 0,1 0,54 20"/>

              <path
                  android:fillColor="#263A91"
                  android:pathData="M54,31 A23,23 0,1 0,54 77 A23,23 0,1 0,54 31"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M43,43 L65,43 L65,65 L43,65 Z"/>
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="MCVPAS"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/mcvpas/MainActivity.java <<'EOF'
          package com.mcvpas;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;

          import java.text.SimpleDateFormat;
          import java.util.Locale;
          import java.util.Date;

          public class MainActivity extends Activity {

              LinearLayout root;
              SharedPreferences prefs;

              final int BLUE = Color.rgb(38, 58, 145);
              final int RED = Color.rgb(211, 47, 47);
              final int DARK = Color.rgb(35, 35, 45);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences("MCVPAS_DATA", MODE_PRIVATE);

                  if (!prefs.getBoolean("initialized", false)) {
                      initializeDemoData();
                  }

                  splash();
              }

              void splash() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER);
                  box.setBackgroundColor(BLUE);

                  TextView logo = new TextView(this);
                  logo.setText("MCVPAS");
                  logo.setTextColor(Color.WHITE);
                  logo.setTextSize(42);
                  logo.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  logo.setGravity(Gravity.CENTER);

                  TextView sub = new TextView(this);
                  sub.setText(
                      "Smart Missing Child and\n" +
                      "Vulnerable Person Alert System"
                  );
                  sub.setTextColor(Color.WHITE);
                  sub.setTextSize(16);
                  sub.setGravity(Gravity.CENTER);
                  sub.setPadding(20, 10, 20, 0);

                  box.addView(logo);
                  box.addView(sub);

                  setContentView(box);

                  new Handler().postDelayed(this::home, 1800);
              }

              void initializeDemoData() {
                  prefs.edit()
                      .putBoolean("initialized", true)
                      .putInt("caseCount", 2)
                      .putString("case1",
                          "MCV-001|Sample Child|12|Angeles City|" +
                          "Wearing blue shirt. Last seen near the public market.|ACTIVE")
                      .putString("case2",
                          "MCV-002|Sample Vulnerable Person|65|Mabalacat City|" +
                          "Last seen near the transport terminal.|ACTIVE")
                      .putInt("sightingCount", 0)
                      .putInt("alertCount", 2)
                      .apply();
              }

              TextView title(String text) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(28);
                  t.setTextColor(BLUE);
                  t.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(10, 20, 10, 20);
                  return t;
              }

              TextView subtitle(String text) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(15);
                  t.setTextColor(Color.DKGRAY);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(15, 0, 15, 18);
                  return t;
              }

              Button button(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(16);
                  b.setAllCaps(false);
                  b.setPadding(12, 12, 12, 12);

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT);

                  p.setMargins(0, 7, 0, 7);
                  b.setLayoutParams(p);

                  return b;
              }

              EditText field(String hint) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setTextSize(16);
                  e.setPadding(20, 12, 20, 12);

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT);

                  p.setMargins(0, 5, 0, 5);
                  e.setLayoutParams(p);

                  return e;
              }

              void base(String pageTitle) {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(22, 10, 22, 20);
                  root.setBackgroundColor(Color.rgb(248, 249, 252));

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);

                  setContentView(scroll);

                  root.addView(title(pageTitle));
              }

              void home() {
                  base("MCVPAS");

                  root.addView(subtitle(
                      "Smart Missing Child and Vulnerable Person Alert System"
                  ));

                  TextView status = new TextView(this);
                  status.setText(
                      "SYSTEM STATUS: ONLINE\n" +
                      "Community Alert and Case Monitoring"
                  );
                  status.setTextSize(15);
                  status.setTextColor(Color.rgb(20, 110, 60));
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(10, 5, 10, 15);
                  root.addView(status);

                  Button report = button("🚨  Report Missing Person");
                  report.setOnClickListener(v -> report());
                  root.addView(report);

                  Button cases = button("📋  View Active Cases");
                  cases.setOnClickListener(v -> cases());
                  root.addView(cases);

                  Button sighting = button("📍  Submit a Sighting");
                  sighting.setOnClickListener(v -> sighting());
                  root.addView(sighting);

                  Button alerts = button("🔔  Alerts");
                  alerts.setOnClickListener(v -> alerts());
                  root.addView(alerts);

                  Button photo = button("📷  Photo Matching Demo");
                  photo.setOnClickListener(v -> photoMatching());
                  root.addView(photo);

                  Button admin = button("🔐  Admin Dashboard");
                  admin.setOnClickListener(v -> admin());
                  root.addView(admin);

                  TextView demo = new TextView(this);
                  demo.setText(
                      "\nDEFENSE DEMO\n" +
                      "Sample data is included for demonstration."
                  );
                  demo.setTextSize(13);
                  demo.setTextColor(Color.GRAY);
                  demo.setGravity(Gravity.CENTER);
                  root.addView(demo);
              }
              void report() {
                  base("Report Missing Person");

                  root.addView(subtitle(
                      "Enter the information needed to create a missing-person case."
                  ));

                  EditText name = field("Full Name");
                  EditText age = field("Age");
                  EditText location = field("Last Known Location");
                  EditText description = field("Description / Clothing / Other Details");

                  root.addView(name);
                  root.addView(age);
                  root.addView(location);
                  root.addView(description);

                  Button submit = button("🚨 Submit Missing Person Report");

                  submit.setOnClickListener(v -> {

                      if (name.getText().toString().trim().isEmpty() ||
                          age.getText().toString().trim().isEmpty() ||
                          location.getText().toString().trim().isEmpty()) {

                          Toast.makeText(
                              this,
                              "Please complete the required fields.",
                              Toast.LENGTH_LONG
                          ).show();

                          return;
                      }

                      int count = prefs.getInt("caseCount", 0) + 1;

                      String caseId = String.format(
                          Locale.US,
                          "MCV-%03d",
                          count
                      );

                      String data =
                          caseId + "|" +
                          name.getText().toString().trim() + "|" +
                          age.getText().toString().trim() + "|" +
                          location.getText().toString().trim() + "|" +
                          description.getText().toString().trim() + "|ACTIVE";

                      prefs.edit()
                          .putInt("caseCount", count)
                          .putString("case" + count, data)
                          .putInt(
                              "alertCount",
                              prefs.getInt("alertCount", 0) + 1
                          )
                          .apply();

                      Toast.makeText(
                          this,
                          "Report submitted successfully!\nCase ID: " + caseId,
                          Toast.LENGTH_LONG
                      ).show();

                      cases();
                  });

                  root.addView(submit);

                  Button back = button("← Back to Home");
                  back.setOnClickListener(v -> home());
                  root.addView(back);
              }

              void cases() {
                  base("Active Cases");

                  int count = prefs.getInt("caseCount", 0);

                  TextView countText = new TextView(this);
                  countText.setText(
                      "Total Registered Cases: " + count
                  );
                  countText.setTextSize(16);
                  countText.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  countText.setPadding(5, 5, 5, 15);
                  root.addView(countText);

                  for (int i = 1; i <= count; i++) {

                      String data = prefs.getString("case" + i, "");

                      if (data.isEmpty()) {
                          continue;
                      }

                      String[] parts = data.split("\\|", -1);

                      if (parts.length < 6) {
                          continue;
                      }

                      LinearLayout card = new LinearLayout(this);
                      card.setOrientation(LinearLayout.VERTICAL);
                      card.setPadding(18, 15, 18, 15);
                      card.setBackgroundColor(Color.WHITE);

                      TextView caseText = new TextView(this);

                      caseText.setText(
                          "CASE ID: " + parts[0] + "\n\n" +
                          "Name: " + parts[1] + "\n" +
                          "Age: " + parts[2] + "\n" +
                          "Last Known Location: " + parts[3] + "\n\n" +
                          "Description:\n" + parts[4] + "\n\n" +
                          "STATUS: " + parts[5]
                      );

                      caseText.setTextSize(16);
                      caseText.setTextColor(DARK);

                      card.addView(caseText);

                      Button sight = button("📍 Submit Sighting for " + parts[0]);

                      final String selectedCase = parts[0];

                      sight.setOnClickListener(
                          v -> sightingForCase(selectedCase)
                      );

                      card.addView(sight);

                      root.addView(card);

                      Space space = new Space(this);

                      root.addView(
                          space,
                          new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              15
                          )
                      );
                  }

                  Button back = button("← Back to Home");
                  back.setOnClickListener(v -> home());
                  root.addView(back);
              }

              void sighting() {
                  base("Submit a Sighting");

                  root.addView(subtitle(
                      "Submit information if you have seen a person connected to an active case."
                  ));

                  EditText caseId = field("Case Number (example: MCV-001)");
                  EditText location = field("Sighting Location");
                  EditText details = field("What did you see?");
                  EditText reporter = field("Your Name / Reporter");

                  root.addView(caseId);
                  root.addView(location);
                  root.addView(details);
                  root.addView(reporter);

                  Button submit = button("📍 Submit Sighting");

                  submit.setOnClickListener(v -> {

                      if (caseId.getText().toString().trim().isEmpty() ||
                          location.getText().toString().trim().isEmpty() ||
                          details.getText().toString().trim().isEmpty()) {

                          Toast.makeText(
                              this,
                              "Please complete the required fields.",
                              Toast.LENGTH_LONG
                          ).show();

                          return;
                      }

                      saveSighting(
                          caseId.getText().toString().trim(),
                          location.getText().toString().trim(),
                          details.getText().toString().trim(),
                          reporter.getText().toString().trim()
                      );
                  });

                  root.addView(submit);

                  Button back = button("← Back to Home");
                  back.setOnClickListener(v -> home());
                  root.addView(back);
              }

              void sightingForCase(String caseId) {
                  base("Submit Sighting");

                  TextView selected = new TextView(this);

                  selected.setText(
                      "Selected Case: " + caseId
                  );

                  selected.setTextSize(18);
                  selected.setTextColor(BLUE);
                  selected.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );
                  selected.setPadding(5, 5, 5, 15);

                  root.addView(selected);

                  EditText location = field("Sighting Location");
                  EditText details = field("What did you see?");
                  EditText reporter = field("Your Name / Reporter");

                  root.addView(location);
                  root.addView(details);
                  root.addView(reporter);

                  Button submit = button("📍 Submit Sighting");

                  submit.setOnClickListener(v -> {

                      if (location.getText().toString().trim().isEmpty() ||
                          details.getText().toString().trim().isEmpty()) {

                          Toast.makeText(
                              this,
                              "Please complete the required fields.",
                              Toast.LENGTH_LONG
                          ).show();

                          return;
                      }

                      saveSighting(
                          caseId,
                          location.getText().toString().trim(),
                          details.getText().toString().trim(),
                          reporter.getText().toString().trim()
                      );
                  });

                  root.addView(submit);

                  Button back = button("← Back to Cases");
                  back.setOnClickListener(v -> cases());
                  root.addView(back);
              }

              void saveSighting(
                  String caseId,
                  String location,
                  String details,
                  String reporter
              ) {

                  int count =
                      prefs.getInt("sightingCount", 0) + 1;

                  String date =
                      new SimpleDateFormat(
                          "MMM dd, yyyy HH:mm",
                          Locale.US
                      ).format(new Date());

                  String sighting =
                      "SIGHT-" +
                      String.format(Locale.US, "%03d", count) +
                      "|" +
                      caseId +
                      "|" +
                      location +
                      "|" +
                      details +
                      "|" +
                      reporter +
                      "|" +
                      date;

                  prefs.edit()
                      .putInt("sightingCount", count)
                      .putString(
                          "sighting" + count,
                          sighting
                      )
                      .putInt(
                          "alertCount",
                          prefs.getInt("alertCount", 0) + 1
                      )
                      .apply();

                  Toast.makeText(
                      this,
                      "Sighting submitted successfully!\n" +
                      "Authorities can review this report.",
                      Toast.LENGTH_LONG
                  ).show();

                  home();
              }

              void alerts() {
                  base("Alerts");

                  int alertCount =
                      prefs.getInt("alertCount", 0);

                  TextView heading = new TextView(this);

                  heading.setText(
                      "🔔 Current System Alerts"
                  );

                  heading.setTextSize(20);
                  heading.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );
                  heading.setTextColor(RED);
                  heading.setPadding(5, 5, 5, 15);

                  root.addView(heading);

                  if (alertCount == 0) {

                      TextView empty = new TextView(this);

                      empty.setText(
                          "No alerts at this time."
                      );

                      empty.setTextSize(17);
                      root.addView(empty);

                  } else {

                      TextView alert = new TextView(this);

                      alert.setText(
                          "ACTIVE ALERTS\n\n" +
                          "There are " +
                          alertCount +
                          " recorded system alert(s).\n\n" +
                          "Please check Active Cases and review " +
                          "recent sightings for important information."
                      );

                      alert.setTextSize(17);
                      alert.setTextColor(DARK);
                      alert.setPadding(5, 5, 5, 20);

                      root.addView(alert);
                  }

                  Button viewCases =
                      button("📋 View Active Cases");

                  viewCases.setOnClickListener(
                      v -> cases()
                  );

                  root.addView(viewCases);

                  Button back =
                      button("← Back to Home");

                  back.setOnClickListener(
                      v -> home()
                  );

                  root.addView(back);
              }

              void photoMatching() {
                  base("Photo Matching Demo");

                  root.addView(subtitle(
                      "Demonstration module for the proposed AI-assisted "
                      + "photo matching feature."
                  ));

                  TextView explanation = new TextView(this);

                  explanation.setText(
                      "AI-ASSISTED PHOTO MATCHING\n\n" +
                      "This defense demonstration simulates the "
                      + "photo-matching workflow using sample data.\n\n" +
                      "Step 1: Select a sample case.\n" +
                      "Step 2: Start the matching process.\n" +
                      "Step 3: The system displays a simulated "
                      + "matching result.\n\n" +
                      "Note: This prototype demonstrates the workflow "
                      + "and interface. It does not claim to perform "
                      + "real-world biometric identification."
                  );

                  explanation.setTextSize(16);
                  explanation.setTextColor(DARK);
                  explanation.setPadding(5, 5, 5, 20);

                  root.addView(explanation);

                  Button sample1 =
                      button("📷 Test Sample Case MCV-001");

                  sample1.setOnClickListener(
                      v -> runPhotoDemo("MCV-001")
                  );

                  root.addView(sample1);

                  Button sample2 =
                      button("📷 Test Sample Case MCV-002");

                  sample2.setOnClickListener(
                      v -> runPhotoDemo("MCV-002")
                  );

                  root.addView(sample2);

                  Button back =
                      button("← Back to Home");

                  back.setOnClickListener(
                      v -> home()
                  );

                  root.addView(back);
              }

              void runPhotoDemo(String caseId) {

                  Toast.makeText(
                      this,
                      "Analyzing sample photo...",
                      Toast.LENGTH_LONG
                  ).show();

                  new Handler().postDelayed(() -> {

                      new AlertDialog.Builder(this)
                          .setTitle("Photo Matching Result")
                          .setMessage(
                              "Sample Case: " + caseId + "\n\n" +
                              "Result: DEMO MATCH FOUND\n\n" +
                              "Confidence: 94%\n\n" +
                              "This result is simulated for research "
                              + "prototype demonstration."
                          )
                          .setPositiveButton(
                              "OK",
                              null
                          )
                          .show();

                  }, 1500);
              }