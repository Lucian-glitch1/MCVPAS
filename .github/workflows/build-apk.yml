name: MCVPAS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build project
        run: |
          mkdir -p app/src/main/java/com/mcvpas
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name="MCVPAS"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.mcvpas'
            compileSdk 35

            defaultConfig {
              applicationId 'com.mcvpas'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme"
              parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#3949AB</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:theme="@style/AppTheme"
              android:label="MCVPAS"
              android:allowBackup="false">

              <activity
                android:name=".MainActivity"
                android:exported="true">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>

              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/mcvpas/MainActivity.java <<'EOF'
          package com.mcvpas;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.*;

          public class MainActivity extends Activity {

            LinearLayout layout;

            @Override
            public void onCreate(Bundle b) {
              super.onCreate(b);
              home();
            }

            TextView title(String s) {
              TextView t = new TextView(this);
              t.setText(s);
              t.setTextSize(28);
              t.setTextColor(Color.rgb(26,35,126));
              t.setGravity(Gravity.CENTER);
              t.setPadding(10,30,10,20);
              return t;
            }

            Button button(String s) {
              Button b = new Button(this);
              b.setText(s);
              b.setAllCaps(false);
              b.setTextSize(17);
              return b;
            }

            void home() {
              layout = new LinearLayout(this);
              layout.setOrientation(LinearLayout.VERTICAL);
              layout.setPadding(25,20,25,20);

              ScrollView scroll = new ScrollView(this);
              scroll.addView(layout);
              setContentView(scroll);

              layout.addView(title("MCVPAS"));

              TextView info = new TextView(this);
              info.setText(
                "Smart Missing Child and Vulnerable Person Alert System\n\n" +
                "Helping communities report and monitor missing persons."
              );
              info.setTextSize(17);
              layout.addView(info);

              Button report = button("🚨 Report Missing Person");
              report.setOnClickListener(v -> report());
              layout.addView(report);

              Button cases = button("📋 Active Cases");
              cases.setOnClickListener(v -> cases());
              layout.addView(cases);

              Button sighting = button("📍 Submit Sighting");
              sighting.setOnClickListener(v -> sighting());
              layout.addView(sighting);

              Button alerts = button("🔔 Alerts");
              alerts.setOnClickListener(v ->
                Toast.makeText(this,
                  "No new alerts.",
                  Toast.LENGTH_LONG).show());
              layout.addView(alerts);

              Button admin = button("🔐 Admin");
              admin.setOnClickListener(v -> admin());
              layout.addView(admin);
            }

            void report() {
              layout.removeAllViews();
              layout.addView(title("Report Missing Person"));

              EditText name = new EditText(this);
              name.setHint("Full Name");
              layout.addView(name);

              EditText age = new EditText(this);
              age.setHint("Age");
              layout.addView(age);

              EditText location = new EditText(this);
              location.setHint("Last Known Location");
              layout.addView(location);

              EditText details = new EditText(this);
              details.setHint("Description");
              layout.addView(details);

              Button submit = button("🚨 Submit Report");

              submit.setOnClickListener(v -> {
                Toast.makeText(
                  this,
                  "Report submitted successfully.",
                  Toast.LENGTH_LONG
                ).show();
                home();
              });

              layout.addView(submit);

              Button back = button("← Back");
              back.setOnClickListener(v -> home());
              layout.addView(back);
            }

            void cases() {
              layout.removeAllViews();
              layout.addView(title("Active Cases"));

              TextView c = new TextView(this);
              c.setText(
                "CASE-001\n" +
                "Missing Child\n" +
                "Angeles City\n\n" +
                "Status: ACTIVE\n\n" +
                "CASE-002\n" +
                "Vulnerable Person\n" +
                "Mabalacat City\n\n" +
                "Status: ACTIVE"
              );
              c.setTextSize(18);
              layout.addView(c);

              Button back = button("← Back");
              back.setOnClickListener(v -> home());
              layout.addView(back);
            }

            void sighting() {
              layout.removeAllViews();
              layout.addView(title("Submit Sighting"));

              EditText id = new EditText(this);
              id.setHint("Case Number");
              layout.addView(id);

              EditText loc = new EditText(this);
              loc.setHint("Sighting Location");
              layout.addView(loc);

              EditText details = new EditText(this);
              details.setHint("What did you see?");
              layout.addView(details);

              Button submit = button("📍 Submit Sighting");

              submit.setOnClickListener(v -> {
                Toast.makeText(
                  this,
                  "Sighting submitted successfully.",
                  Toast.LENGTH_LONG
                ).show();
                home();
              });

              layout.addView(submit);

              Button back = button("← Back");
              back.setOnClickListener(v -> home());
              layout.addView(back);
            }

            void admin() {
              layout.removeAllViews();
              layout.addView(title("Admin Login"));

              EditText user = new EditText(this);
              user.setHint("Username");
              layout.addView(user);

              EditText pass = new EditText(this);
              pass.setHint("Password");
              pass.setInputType(129);
              layout.addView(pass);

              Button login = button("🔐 Login");

              login.setOnClickListener(v -> {
                if (
                  user.getText().toString().equals("admin") &&
                  pass.getText().toString().equals("mcvpas123")
                ) {
                  adminHome();
                } else {
                  Toast.makeText(
                    this,
                    "Invalid login.",
                    Toast.LENGTH_LONG
                  ).show();
                }
              });

              layout.addView(login);

              Button back = button("← Back");
              back.setOnClickListener(v -> home());
              layout.addView(back);
            }

            void adminHome() {
              layout.removeAllViews();
              layout.addView(title("Admin Dashboard"));

              TextView t = new TextView(this);
              t.setText(
                "MCVPAS ADMIN\n\n" +
                "Active Cases: 2\n" +
                "System Status: ONLINE"
              );
              t.setTextSize(18);
              layout.addView(t);

              Button logout = button("Logout");
              logout.setOnClickListener(v -> home());
              layout.addView(logout);
            }
          }
          EOF

          gradle clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MCVPAS-APK
          path: app/build/outputs/apk/debug/app-debug.apk